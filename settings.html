<div class="smart-import-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Smart Import</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">
            <div class="flex-container alignitemscenter margin-b-10">
                <label class="checkbox_label" for="smart_import_enabled">
                    <input id="smart_import_enabled" type="checkbox" {{#if enabled}}checked{{/if}} />
                    Enable Dupe Checker & Updater
                </label>
            </div>

            <div class="flex-container alignitemscenter justify-space-between margin-b-10" style="padding-left: 40px;">
                <input id="smart_import_delay" class="text_pole" type="number" min="0" max="5000" value="{{delayMs}}" style="width: 60px;" required />
                <label for="smart_import_delay" title="Buffer in ms to prevent rate-limiting.">
                    ms Import Delay
                    <span class="margin5 fa-solid fa-circle-info opacity50p"></span>
                </label>
            </div>

            <hr class="sysHR" />

            <div class="flex-container alignitemscenter margin-b-10">
                <label class="checkbox_label" for="smart_import_auto_tag">
                    <input id="smart_import_auto_tag" type="checkbox" {{#if autoTag}}checked{{/if}} />
                    Auto-Tag Creators (e.g., @CreatorName)
                </label>
            </div>

            <div class="flex-container alignitemscenter justify-space-between margin-top-10" style="padding-left: 40px;">
                <div id="smart_import_retro_tag" class="menu_button">
                    <i class="fa-solid fa-tags" style="margin-right: 10px"></i>
                    Retroactively Tag Existing Characters
                </div>
            </div>

            <div class="flex-container alignitemscenter justify-space-between margin-b-10" style="padding-left: 40px; font-size: 0.9em; opacity: 0.9;">
                <span class="margin-r-10">Tag BG:</span>
                <div id="smart_import_bg_container"></div>

                <span class="margin-r-10 margin-l-10">Text:</span>
                <div id="smart_import_text_container"></div>

                <div id="smart_import_reset_colors" class="menu_button margin-l-10" title="Reset to dynamic theme defaults" style="padding: 4px 8px;">
                    <i class="fa-solid fa-undo"></i>
                </div>
            </div>

        </div>
    </div>
</div>
