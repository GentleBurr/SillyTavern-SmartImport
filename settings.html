<div class="smart-import-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Smart Import</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container alignitemscenter margin-b-10">
                <label class="checkbox_label" for="smart_import_enabled">
                    <input id="smart_import_enabled" type="checkbox" {{#if enabled}}checked{{/if}} />
                    <span>Enable Dupe Checker & Updater</span>
                </label>
            </div>
            
            <div class="flex-container alignitemscenter justify-space-between">
                <input id="smart_import_delay" class="text_pole" type="number" min="0" max="5000" value="{{delayMs}}" style="width: 69px;" required />
                <label for="smart_import_delay">
                    <span>ms Import Delay</span>
                    <small>Buffer between imports to prevent rate-limiting.</small>
                </label>
            </div>
        </div>
    </div>
</div>
